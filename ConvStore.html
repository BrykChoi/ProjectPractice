<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>편의점 RPG</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Noto Sans KR', sans-serif;
  background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
  overflow: hidden;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

#background {
  position: absolute;
  inset: 0;
  background: url('ConvStoreInside.png') no-repeat center center;
  background-size: contain;
  background-color: rgba(0, 0, 0, 0.3);
  filter: brightness(1.1) saturate(1.3) hue-rotate(10deg);
  animation: backgroundPulse 4s ease-in-out infinite;
}

@keyframes backgroundPulse {
  0%, 100% { filter: brightness(1.1) saturate(1.3) hue-rotate(10deg); }
  50% { filter: brightness(1.2) saturate(1.5) hue-rotate(20deg); }
}

#dialogue {
  position: absolute;
  bottom: -20%;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  max-width: 950px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  padding: 35px;
  border-radius: 30px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 40px rgba(102, 126, 234, 0.8);
  border: 4px solid #fff;
  animation: slideUpBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}

#dialogue::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 30px;
  padding: 4px;
  background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #4facfe);
  background-size: 300% 300%;
  animation: borderGlow 3s ease infinite;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

@keyframes borderGlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes slideUpBounce {
  0% {
    opacity: 0;
    transform: translateX(-50%) translateY(50px) scale(0.8);
  }
  60% {
    transform: translateX(-50%) translateY(-10px) scale(1.05);
  }
  100% {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
}

#dialogue::after {
  content: '';
  position: absolute;
  bottom: -25px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 20px;
  border-style: solid;
  border-color: #667eea transparent transparent transparent;
  filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.4));
}

#text {
  margin-bottom: 25px;
  font-size: 22px;
  font-weight: 600;
  min-height: 80px;
  white-space: pre-line;
  cursor: pointer;
  line-height: 1.8;
  color: #fff;
  letter-spacing: 1px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
  animation: textFadeIn 0.8s ease-out;
}

@keyframes textFadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#choices {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

button {
  padding: 18px 25px;
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: #fff;
  border: 3px solid #fff;
  cursor: pointer;
  border-radius: 15px;
  font-size: 18px;
  font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 10px 30px rgba(245, 87, 108, 0.5), inset 0 -3px 0 rgba(0, 0, 0, 0.2);
  position: relative;
  overflow: hidden;
  text-transform: uppercase;
  letter-spacing: 1px;
}

button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s ease;
}

button::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.3s ease;
}

button:hover {
  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  border-color: #fff;
  transform: translateY(-5px) scale(1.05);
  box-shadow: 0 15px 40px rgba(79, 172, 254, 0.6), inset 0 -3px 0 rgba(0, 0, 0, 0.2);
}

button:hover::before {
  left: 100%;
}

button:hover::after {
  opacity: 1;
}

button:active {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4), inset 0 -1px 0 rgba(0, 0, 0, 0.2);
}

#hint {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.8);
  text-align: right;
  display: none;
  margin-top: 20px;
  font-style: italic;
  font-weight: 600;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 49%, 100% { opacity: 1; }
  50%, 99% { opacity: 0.3; }
}

#missionComplete {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.95) 100%);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
  backdrop-filter: blur(8px);
  animation: fadeInBlur 0.4s ease-out;
}

@keyframes fadeInBlur {
  from {
    opacity: 0;
    backdrop-filter: blur(0px);
  }
  to {
    opacity: 1;
    backdrop-filter: blur(8px);
  }
}

.popup-box {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  color: #fff;
  padding: 60px 80px;
  border-radius: 40px;
  text-align: center;
  box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8), 0 0 60px rgba(240, 147, 251, 0.8);
  border: 5px solid #fff;
  animation: popInExplosion 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 600px;
  position: relative;
  overflow: hidden;
}

.popup-box::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2) 0%, transparent 50%);
  pointer-events: none;
}

@keyframes popInExplosion {
  0% {
    opacity: 0;
    transform: scale(0.3) rotateZ(-15deg);
  }
  50% {
    transform: scale(1.1) rotateZ(5deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotateZ(0deg);
  }
}

.popup-box h2 {
  font-size: 72px;
  margin: 0 0 30px 0;
  color: #fff;
  text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.3);
  animation: bounceExplode 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  letter-spacing: 2px;
}

@keyframes bounceExplode {
  0% {
    opacity: 0;
    transform: scale(0) rotateZ(-30deg);
  }
  50% {
    transform: scale(1.2) rotateZ(10deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotateZ(0deg);
  }
}

.popup-box p {
  font-size: 22px;
  margin: 20px 0;
  color: #fff;
  line-height: 1.8;
  font-weight: 500;
}

.popup-box p:first-of-type {
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
  animation: slideInLeft 0.6s ease-out 0.2s both;
}

@keyframes slideInLeft {
  from {
    opacity: 0;
    transform: translateX(-30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.popup-box p:last-of-type {
  font-size: 16px;
  color: rgba(255, 255, 255, 0.9);
  margin-top: 35px;
  animation: slideInRight 0.6s ease-out 0.4s both;
}

@keyframes slideInRight {
  from {
    opacity: 0;
    transform: translateX(30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
</style>
</head>
<body>
<div id='game'>
<div id='background'></div>
<div id='dialogue'><div id='text'></div><div id='choices'></div><div id='hint'>[Enter] 계속</div></div>
</div>
<div id='missionComplete'><div class='popup-box'><h2>🎉 미션 완료</h2><p>카드 구매가 성공적으로 완료되었습니다.</p><p>[Enter]를 눌러 메뉴로 돌아가기</p></div></div>
<script>
let step=0,choices={},isTyping=false,waitingForNext=false,missionDone=false;

function typeText(text,cb){
  const el=document.getElementById('text');
  el.innerText='';
  let i=0;
  isTyping=true;
  function t(){
    if(i<text.length){
      el.innerText+=text[i++];
      setTimeout(t,30);
    }else{
      isTyping=false;
      cb&&cb();
    }
  }
  t();
  el.onclick=()=>{
    if(isTyping){
      el.innerText=text;
      isTyping=false;
      cb&&cb();
    }
  }
}

function clearChoices(){
  choicesDiv.innerHTML='';
  hint.style.display='none';
}

const choicesDiv=document.getElementById('choices'),hint=document.getElementById('hint');

function addChoice(text,val){
  let b=document.createElement('button');
  b.innerText=text;
  b.onclick=()=>!isTyping&&next(val);
  choicesDiv.appendChild(b);
}

function autoNext(){
  clearChoices();
  waitingForNext=true;
  hint.style.display='block';
}

function next(choice=null){
  if(isTyping)return;
  waitingForNext=false;
  if(choice!==null)choices[step]=choice;
  step++;
  render();
}

function createConfetti() {
  const confetti = document.createElement('div');
  confetti.style.position = 'fixed';
  confetti.style.width = '10px';
  confetti.style.height = '10px';
  confetti.style.backgroundColor = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe'][Math.floor(Math.random() * 6)];
  confetti.style.left = Math.random() * 100 + '%';
  confetti.style.top = '-10px';
  confetti.style.borderRadius = '50%';
  confetti.style.pointerEvents = 'none';
  confetti.style.zIndex = '1000';
  
  const tx = (Math.random() - 0.5) * 200;
  const ty = Math.random() * 300 + 200;
  
  confetti.animate([
    { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
    { transform: `translate(${tx}px, ${ty}px) rotate(360deg)`, opacity: 0 }
  ], {
    duration: 2000 + Math.random() * 1000,
    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
  });
  
  document.body.appendChild(confetti);
  setTimeout(() => confetti.remove(), 3000);
}

function showMissionComplete(){
  missionDone=true;
  document.getElementById('missionComplete').style.display='flex';
  
  for(let i=0; i<30; i++){
    setTimeout(() => createConfetti(), i * 30);
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(missionDone){
      localStorage.setItem('cleared_'+localStorage.getItem('current_mission'),'true');
      window.location.href='menu.html';
      return;
    }else if(!isTyping&&waitingForNext)next();
  }
});

function render(){
  clearChoices();
  if(step===1){
    typeText('편의점 사장: 안녕하세요!',()=>{
      addChoice('안녕하세요!','1');
      addChoice('앗… 네… (고개만 끄떡)','2');
      addChoice('(무시하고 둘러본다)','3');
    });
  }
  else if(step===2){
    if(choices[1]==='1'){
      typeText('편의점 사장: 오늘 날씨 좋네요!',()=>{
        addChoice('네, 정말요!','1');
        addChoice('그럼요, 산책 나왔어요.','2');
      });
    }else if(choices[1]==='2'){
      typeText('편의점 사장: 괜찮으세요? 뭔가 피곤해 보이시는데?',()=>{
        addChoice('아, 네... 요즘 바빠서요.','1');
        addChoice('(고개를 끄덕인다)','2');
      });
    }else{
      typeText('편의점 사장: 어? 뭔가 찾으시는 거 있으세요?',()=>{
        addChoice('아, 네! 교통 카드 있나요?','1');
        addChoice('그냥 둘러보고 있어요.','2');
      });
    }
  }
  else if(step===3){
    if(choices[1]==='1' && choices[2]==='1'){
      typeText('편의점 사장: 그런데 혹시 교통 카드 필요하신가요?',()=>{
        addChoice('아, 맞다! 필요했어!','1');
        addChoice('아니요, 이미 있어요.','2');
      });
    }else if(choices[1]==='1' && choices[2]==='2'){
      typeText('편의점 사장: 산책 나오셨으면 카드도 챙기셨겠네요?',()=>{
        addChoice('아, 카드를 안 챙겼네요!','1');
        addChoice('이미 있어요.','2');
      });
    }else if(choices[1]==='2' && choices[2]==='1'){
      typeText('편의점 사장: 그래도 뭔가 필요하신 게 있으시면 말씀해 주세요!',()=>{
        addChoice('교통 카드 구매하고 싶은데요.','1');
        addChoice('아니요, 그냥 쉬러 왔어요.','2');
      });
    }else if(choices[1]==='2' && choices[2]==='2'){
      typeText('편의점 사장: 그럼 편하게 쉬세요. 혹시 필요한 게 있으면 말씀해 주세요!',()=>{
        addChoice('교통 카드 있나요?','1');
        addChoice('(조용히 앉아있다)','2');
      });
    }else if(choices[1]==='3' && choices[2]==='1'){
      typeText('편의점 사장: 뭔가 찾으시는 거 있으세요?',()=>{
        addChoice('교통 카드를 구매하고 싶은데요.','1');
        addChoice('그냥 구경만 하고 있어요.','2');
      });
    }else{
      typeText('편의점 사장: 혹시 뭔가 필요하신 게 있으세요?',()=>{
        addChoice('네, 교통 카드 주세요!','1');
        addChoice('아직 생각 중이에요.','2');
      });
    }
  }
  else if(step===4){
    if(choices[3]==='2' || (choices[1]==='1' && choices[2]==='2') || (choices[1]==='2' && choices[2]==='2') || (choices[1]==='3' && choices[2]==='2')){
      typeText('편의점 사장: 그럼 천천히 보세요. 저는 여기 있으니까요!',()=>{
        addChoice('(한참을 둘러본다)','1');
        addChoice('(갑자기 생각난다) 아! 카드!','2');
      });
    }else{
      typeText('편의점 사장: 아 네! 여기 있습니다. 요즘 많이 사가세요!',()=>{
        addChoice('얼마예요?','1');
        addChoice('충전도 가능한가요?','2');
      });
    }
  }
  else if(step===5){
    if(choices[4]==='1'){
      typeText('편의점 사장: 아, 이제 관심 생기셨군요! 여기 있습니다.',()=>{
        addChoice('얼마예요?','1');
        addChoice('충전도 되나요?','2');
      });
    }else if(choices[4]==='2'){
      typeText('편의점 사장: 네, 물론이죠! 여기 있습니다.',()=>{
        addChoice('얼마인가요?','1');
        addChoice('바로 충전해 주세요!','2');
      });
    }else{
      typeText('편의점 사장: 2000원입니다!',autoNext);
    }
  }
  else if(step===6){
    if(choices[5]==='1' || choices[5]==='2'){
      typeText('편의점 사장: 2000원입니다!',autoNext);
    }else{
      typeText('주인공: 혹시 충전도 가능할까요?',autoNext);
    }
  }
  else if(step===7){
    if(choices[6]!==undefined && choices[6]!=='1'){
      typeText('편의점 사장: 네, 얼마 충전해 드릴까요?',()=>{
        addChoice('5000원 충전해 주세요.','1');
        addChoice('10000원 충전해 주세요.','2');
      });
    }else{
      typeText('주인공: 혹시 충전도 가능할까요?',autoNext);
    }
  }
  else if(step===8){
    if(choices[7]===undefined){
      typeText('편의점 사장: 네, 얼마 충전해 드릴까요?',()=>{
        addChoice('5000원 충전해 주세요.','1');
        addChoice('10000원 충전해 주세요.','2');
      });
    }else{
      typeText(choices[7]==='1'?'(5000원을 건넸다)\n5000원 충전 중...':'(10000원을 건넸다)\n10000원 충전 중...',autoNext);
    }
  }
  else if(step===9){
    typeText(choices[7]==='1'?'충전 완료! 카드 + 거스름돈 3000원':'충전 완료! 카드 획득',autoNext);
  }
  else if(step===10){
    typeText(choices[7]==='1'?'주인공: 감사합니다!\n편의점 사장: 안녕히 가세요!':'주인공: 감사합니다...',autoNext);
  }
  else if(step===11){
    if(choices[7]==='2'){
      typeText('편의점 사장: 잠시만요! 카드값 안 내셨어요!',()=>{
        addChoice('어머! 내 정신 봐!','1');
        addChoice('앗! 죄송합니다','2');
      });
    }else{
      typeText('[교통 카드 구매 완료!]',showMissionComplete);
    }
  }
  else if(step===12){
    typeText('5000원 결제 → 거스름돈 3000원',autoNext);
  }
  else if(step===13){
    typeText('편의점 사장: 안녕히 가세요!\n주인공: 안녕히 계세요!',showMissionComplete);
  }
}

next();
</script>
</body>
</html>
