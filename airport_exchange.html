<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공항 환전 RPG</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Noto Sans KR', sans-serif;
  background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
  overflow: hidden;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

#background {
  position: absolute;
  inset: 0;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center center;
  background-color: rgba(0, 0, 0, 0.3);
  filter: brightness(1.1) saturate(1.3) hue-rotate(10deg);
  animation: backgroundPulse 4s ease-in-out infinite;
}

@keyframes backgroundPulse {
  0%, 100% { filter: brightness(1) saturate(1); }
  50% { filter: brightness(1.1) saturate(1.2); }
}

#dialogue {
  position: absolute;
  bottom: -15%;
  left: 50%;
  transform: translateX(-50%);
  width: 80%;
  max-width: 950px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  padding: 35px;
  border-radius: 30px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 40px rgba(102, 126, 234, 0.8);
  border: 4px solid #fff;
  animation: slideUpBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}

#dialogue::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 30px;
  padding: 4px;
  background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #4facfe);
  background-size: 300% 300%;
  animation: borderGlow 3s ease infinite;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

@keyframes borderGlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes slideUpBounce {
  0% {
    opacity: 0;
    transform: translateX(-50%) translateY(50px) scale(0.8);
  }
  60% {
    transform: translateX(-50%) translateY(-10px) scale(1.05);
  }
  100% {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
}

#dialogue::after {
  content: '';
  position: absolute;
  bottom: -25px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 20px;
  border-style: solid;
  border-color: #667eea transparent transparent transparent;
  filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.4));
}

#text {
  margin-bottom: 25px;
  font-size: 22px;
  font-weight: 600;
  min-height: 80px;
  white-space: pre-line;
  cursor: pointer;
  line-height: 1.8;
  color: #fff;
  letter-spacing: 1px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
  animation: textFadeIn 0.8s ease-out;
}

@keyframes textFadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#choices {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

button {
  padding: 18px 25px;
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: #fff;
  border: 3px solid #fff;
  cursor: pointer;
  border-radius: 15px;
  font-size: 18px;
  font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 10px 30px rgba(245, 87, 108, 0.5), inset 0 -3px 0 rgba(0, 0, 0, 0.2);
  position: relative;
  overflow: hidden;
  text-transform: uppercase;
  letter-spacing: 1px;
}

button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s ease;
}

button::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.3s ease;
}

button:hover {
  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  border-color: #fff;
  transform: translateY(-5px) scale(1.05);
  box-shadow: 0 15px 40px rgba(79, 172, 254, 0.6), inset 0 -3px 0 rgba(0, 0, 0, 0.2);
}

button:hover::before {
  left: 100%;
}

button:hover::after {
  opacity: 1;
}

button:active {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4), inset 0 -1px 0 rgba(0, 0, 0, 0.2);
}

#hint {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.8);
  text-align: right;
  display: none;
  margin-top: 20px;
  font-style: italic;
  font-weight: 600;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 49%, 100% { opacity: 1; }
  50%, 99% { opacity: 0.3; }
}

#missionComplete {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.95) 100%);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
  backdrop-filter: blur(8px);
  animation: fadeInBlur 0.4s ease-out;
}

@keyframes fadeInBlur {
  from {
    opacity: 0;
    backdrop-filter: blur(0px);
  }
  to {
    opacity: 1;
    backdrop-filter: blur(8px);
  }
}

.popup-box {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  color: #fff;
  padding: 60px 80px;
  border-radius: 40px;
  text-align: center;
  box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8), 0 0 60px rgba(240, 147, 251, 0.8);
  border: 5px solid #fff;
  animation: popInExplosion 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 600px;
  position: relative;
  overflow: hidden;
}

.popup-box::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2) 0%, transparent 50%);
  pointer-events: none;
}

@keyframes popInExplosion {
  0% {
    opacity: 0;
    transform: scale(0.3) rotateZ(-15deg);
  }
  50% {
    transform: scale(1.1) rotateZ(5deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotateZ(0deg);
  }
}

.popup-box h2 {
  font-size: 72px;
  margin: 0 0 30px 0;
  color: #fff;
  text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.3);
  animation: bounceExplode 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  letter-spacing: 2px;
}

@keyframes bounceExplode {
  0% {
    opacity: 0;
    transform: scale(0) rotateZ(-30deg);
  }
  50% {
    transform: scale(1.2) rotateZ(10deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotateZ(0deg);
  }
}

.popup-box p {
  font-size: 22px;
  margin: 20px 0;
  color: #fff;
  line-height: 1.8;
  font-weight: 500;
}

.popup-box p:first-of-type {
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
  animation: slideInLeft 0.6s ease-out 0.2s both;
}

@keyframes slideInLeft {
  from {
    opacity: 0;
    transform: translateX(-30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.popup-box p:last-of-type {
  font-size: 16px;
  color: rgba(255, 255, 255, 0.9);
  margin-top: 35px;
  animation: slideInRight 0.6s ease-out 0.4s both;
}

@keyframes slideInRight {
  from {
    opacity: 0;
    transform: translateX(30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
</style>
</head>
<body>
<div id='game'>
<div id='background'>✈️</div>
<div id='dialogue'><div id='text'></div><div id='choices'></div><div id='hint'>[Enter] 계속</div></div>
</div>
<div id='missionComplete'><div class='popup-box'><h2>💰 환전 완료!</h2><p>달러를 원으로 성공적으로 환전했습니다!</p><p>[Enter]를 눌러 메뉴로 돌아가기</p></div></div>
<script>
let step=0,choices={},isTyping=false,waitingForNext=false,missionDone=false;

function changeBackground(imagePath) {
  const bg = document.getElementById('background');
  bg.style.backgroundImage = `url('${imagePath}')`;
}

function typeText(text,cb){
  const el=document.getElementById('text');
  el.innerText='';
  let i=0;
  isTyping=true;
  function t(){
    if(i<text.length){
      el.innerText+=text[i++];
      setTimeout(t,30);
    }else{
      isTyping=false;
      cb&&cb();
    }
  }
  t();
  el.onclick=()=>{
    if(isTyping){
      el.innerText=text;
      isTyping=false;
      cb&&cb();
    }
  }
}

function clearChoices(){
  choicesDiv.innerHTML='';
  hint.style.display='none';
}

const choicesDiv=document.getElementById('choices'),hint=document.getElementById('hint');

function addChoice(text,val){
  let b=document.createElement('button');
  b.innerText=text;
  b.onclick=()=>!isTyping&&next(val);
  choicesDiv.appendChild(b);
}

function autoNext(){
  clearChoices();
  waitingForNext=true;
  hint.style.display='block';
}

function next(choice=null){
  if(isTyping)return;
  waitingForNext=false;
  if(choice!==null)choices[step]=choice;
  step++;
  render();
}

function createConfetti() {
  const confetti = document.createElement('div');
  confetti.style.position = 'fixed';
  confetti.style.width = '10px';
  confetti.style.height = '10px';
  confetti.style.backgroundColor = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe'][Math.floor(Math.random() * 6)];
  confetti.style.left = Math.random() * 100 + '%';
  confetti.style.top = '-10px';
  confetti.style.borderRadius = '50%';
  confetti.style.pointerEvents = 'none';
  confetti.style.zIndex = '1000';
  
  const tx = (Math.random() - 0.5) * 200;
  const ty = Math.random() * 300 + 200;
  
  confetti.animate([
    { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
    { transform: `translate(${tx}px, ${ty}px) rotate(360deg)`, opacity: 0 }
  ], {
    duration: 2000 + Math.random() * 1000,
    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
  });
  
  document.body.appendChild(confetti);
  setTimeout(() => confetti.remove(), 3000);
}

function showMissionComplete(){
  missionDone=true;
  document.getElementById('missionComplete').style.display='flex';
  
  for(let i=0; i<30; i++){
    setTimeout(() => createConfetti(), i * 30);
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(missionDone){
      localStorage.setItem('cleared_'+localStorage.getItem('current_mission'),'true');
      window.location.href='menu.html';
      return;
    }else if(!isTyping&&waitingForNext)next();
  }
});

function render(){
  clearChoices();
  if(step===1){
    changeBackground('Airport.png');
    typeText('공항 안내원: 어서오세요! 한국에 오신 것을 환영합니다!',()=>{
      addChoice('감사합니다! 환전소를 찾고 있어요.','1');
      addChoice('(고개를 끄덕인다)','2');
      addChoice('(주변을 둘러본다)','3');
    });
  }
  else if(step===2){
    changeBackground('Airport.png');
    if(choices[1]==='1'){
      typeText('공항 안내원: 아, 환전이 필요하신가요? 달러를 원으로 바꾸시려고요?',()=>{
        addChoice('네, 맞습니다!','1');
        addChoice('네, 얼마나 환전할 수 있나요?','2');
      });
    }else if(choices[1]==='2'){
      typeText('공항 안내원: 뭔가 필요하신 게 있으세요?',()=>{
        addChoice('환전소를 찾고 있어요.','1');
        addChoice('(손짓으로 환전을 표현한다)','2');
      });
    }else{
      typeText('공항 안내원: 뭔가 찾으시는 거 있으세요?',()=>{
        addChoice('환전소가 어디 있나요?','1');
        addChoice('(영어로 "Exchange?"라고 말한다)','2');
      });
    }
  }
  else if(step===3){
    changeBackground('Airport.png');
    if((choices[1]==='1' && choices[2]==='1') || (choices[1]==='1' && choices[2]==='2')){
      typeText('공항 안내원: 환전소는 바로 저쪽입니다! 직진하다가 왼쪽으로 꺾으면 보일 거예요.',()=>{
        addChoice('감사합니다! 가보겠습니다.','1');
        addChoice('혹시 환율이 좋은가요?','2');
      });
    }else if(choices[1]==='2' && choices[2]==='1'){
      typeText('공항 안내원: 아, 환전소를 찾으시는군요! 저쪽으로 가시면 됩니다.',()=>{
        addChoice('감사합니다!','1');
        addChoice('얼마나 멀어요?','2');
      });
    }else if(choices[1]==='2' && choices[2]==='2'){
      typeText('공항 안내원: 아, 환전이 필요하신가요? 환전소는 저쪽입니다!',()=>{
        addChoice('감사합니다!','1');
        addChoice('(고개를 끄덕인다)','2');
      });
    }else if(choices[1]==='3' && choices[2]==='1'){
      typeText('공항 안내원: 환전소요? 바로 저쪽입니다! 표지판을 따라가시면 돼요.',()=>{
        addChoice('감사합니다!','1');
        addChoice('(서둘러 간다)','2');
      });
    }else{
      typeText('공항 안내원: 환전소는 저쪽입니다! 직진하다가 왼쪽으로 꺾으세요.',()=>{
        addChoice('감사합니다!','1');
        addChoice('(고개를 끄덕인다)','2');
      });
    }
  }
  else if(step===4){
    changeBackground('MoneyExchange.png');
    typeText('(환전소에 도착했다)\n환전소 직원: 어서오세요! 무엇을 도와드릴까요?',()=>{
      addChoice('달러를 원으로 환전해 주세요.','1');
      addChoice('환율이 어떻게 되나요?','2');
      addChoice('(달러를 꺼낸다)','3');
    });
  }
  else if(step===5){
    changeBackground('MoneyExchange.png');
    if(choices[4]==='1'){
      typeText('환전소 직원: 네, 얼마를 환전해 드릴까요?',()=>{
        addChoice('100달러 환전해 주세요.','1');
        addChoice('500달러 환전해 주세요.','2');
        addChoice('1000달러 환전해 주세요.','3');
      });
    }else if(choices[4]==='2'){
      typeText('환전소 직원: 현재 환율은 1달러에 1,200원입니다. 얼마를 환전하시겠어요?',()=>{
        addChoice('100달러 환전해 주세요.','1');
        addChoice('500달러 환전해 주세요.','2');
        addChoice('1000달러 환전해 주세요.','3');
      });
    }else{
      typeText('환전소 직원: 아, 달러를 환전하시려고요? 얼마를 환전해 드릴까요?',()=>{
        addChoice('100달러 환전해 주세요.','1');
        addChoice('500달러 환전해 주세요.','2');
        addChoice('1000달러 환전해 주세요.','3');
      });
    }
  }
  else if(step===6){
    changeBackground('MoneyExchange.png');
    if(choices[5]==='1'){
      typeText('환전소 직원: 100달러요? 그럼 120,000원이 됩니다.',()=>{
        addChoice('네, 환전해 주세요.','1');
        addChoice('(달러를 건넨다)','2');
      });
    }else if(choices[5]==='2'){
      typeText('환전소 직원: 500달러요? 그럼 600,000원이 됩니다.',()=>{
        addChoice('네, 환전해 주세요.','1');
        addChoice('(달러를 건넨다)','2');
      });
    }else{
      typeText('환전소 직원: 1000달러요? 그럼 1,200,000원이 됩니다.',()=>{
        addChoice('네, 환전해 주세요.','1');
        addChoice('(달러를 건넨다)','2');
      });
    }
  }
  else if(step===7){
    changeBackground('MoneyExchange.png');
    typeText('환전소 직원: 잠깐만요, 여권을 확인해야 합니다.',()=>{
      addChoice('(여권을 건넨다)','1');
      addChoice('여권이 어디 있지?','2');
    });
  }
  else if(step===8){
    changeBackground('MoneyExchange.png');
    if(choices[7]==='1'){
      typeText('환전소 직원: 감사합니다. (여권을 확인한다) 좋습니다!',autoNext);
    }else{
      typeText('환전소 직원: 여권이 필요합니다. 찾아오실 수 있나요?',()=>{
        addChoice('(가방을 뒤진다) 여기 있습니다!','1');
        addChoice('(당황한다)','2');
      });
    }
  }
  else if(step===9){
    changeBackground('MoneyExchange.png');
    if(choices[8]===undefined || choices[8]==='1'){
      typeText('환전소 직원: 환전을 진행하겠습니다. (계산기를 두드린다)',autoNext);
    }else{
      typeText('환전소 직원: 괜찮습니다. 천천히 찾으세요.',()=>{
        addChoice('(여권을 찾는다) 여기 있습니다!','1');
        addChoice('(다시 가방을 뒤진다)','2');
      });
    }
  }
  else if(step===10){
    changeBackground('MoneyExchange.png');
    typeText('환전소 직원: 환전이 완료되었습니다! (원화를 건넨다)',autoNext);
  }
  else if(step===11){
    changeBackground('MoneyExchange.png');
    typeText('주인공: 감사합니다! 정말 도움이 됐어요!',autoNext);
  }
  else if(step===12){
    changeBackground('MoneyExchange.png');
    typeText('환전소 직원: 한국 여행 즐기세요! 다시 오세요!',showMissionComplete);
  }
}

next();
</script>
</body>
</html>
