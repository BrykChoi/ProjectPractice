<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공항 분실물 센터 RPG</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Noto Sans KR', sans-serif;
  background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #4facfe);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
  overflow: hidden;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

#background {
  position: absolute;
  inset: 0;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center center;
  background-color: rgba(0, 0, 0, 0.3);
  filter: brightness(1.1) saturate(1.3) hue-rotate(10deg);
  animation: backgroundPulse 4s ease-in-out infinite;
}

@keyframes backgroundPulse {
  0%, 100% { filter: brightness(1.1) saturate(1.3) hue-rotate(10deg); }
  50% { filter: brightness(1.2) saturate(1.5) hue-rotate(20deg); }
}

#dialogue {
  position: absolute;
  bottom: -15%;
  left: 50%;
  transform: translateX(-50%);
  width: 25%;
  max-width: 950px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  padding: 35px;
  border-radius: 30px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 40px rgba(102, 126, 234, 0.8);
  border: 4px solid #fff;
  animation: slideUpBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}

#dialogue::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 30px;
  padding: 4px;
  background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #4facfe);
  background-size: 300% 300%;
  animation: borderGlow 3s ease infinite;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

@keyframes borderGlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

@keyframes slideUpBounce {
  0% {
    opacity: 0;
    transform: translateX(-50%) translateY(50px) scale(0.8);
  }
  60% {
    transform: translateX(-50%) translateY(-10px) scale(1.05);
  }
  100% {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
}

#dialogue::after {
  content: '';
  position: absolute;
  bottom: -25px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 20px;
  border-style: solid;
  border-color: #667eea transparent transparent transparent;
  filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.4));
}

#text {
  margin-bottom: 25px;
  font-size: 22px;
  font-weight: 600;
  min-height: 80px;
  white-space: pre-line;
  cursor: pointer;
  line-height: 1.8;
  color: #fff;
  letter-spacing: 1px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
  animation: textFadeIn 0.8s ease-out;
}

@keyframes textFadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#choices {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

button {
  padding: 18px 25px;
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  color: #fff;
  border: 3px solid #fff;
  cursor: pointer;
  border-radius: 15px;
  font-size: 18px;
  font-weight: 700;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 10px 30px rgba(245, 87, 108, 0.5), inset 0 -3px 0 rgba(0, 0, 0, 0.2);
  position: relative;
  overflow: hidden;
  text-transform: uppercase;
  letter-spacing: 1px;
}

button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s ease;
}

button::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.3s ease;
}

button:hover {
  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  border-color: #fff;
  transform: translateY(-5px) scale(1.05);
  box-shadow: 0 15px 40px rgba(79, 172, 254, 0.6), inset 0 -3px 0 rgba(0, 0, 0, 0.2);
}

button:hover::before {
  left: 100%;
}

button:hover::after {
  opacity: 1;
}

button:active {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4), inset 0 -1px 0 rgba(0, 0, 0, 0.2);
}

#hint {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.8);
  text-align: right;
  display: none;
  margin-top: 20px;
  font-style: italic;
  font-weight: 600;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 49%, 100% { opacity: 1; }
  50%, 99% { opacity: 0.3; }
}

#missionComplete {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.95) 100%);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
  backdrop-filter: blur(8px);
  animation: fadeInBlur 0.4s ease-out;
}

@keyframes fadeInBlur {
  from {
    opacity: 0;
    backdrop-filter: blur(0px);
  }
  to {
    opacity: 1;
    backdrop-filter: blur(8px);
  }
}

.popup-box {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  color: #fff;
  padding: 60px 80px;
  border-radius: 40px;
  text-align: center;
  box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8), 0 0 60px rgba(240, 147, 251, 0.8);
  border: 5px solid #fff;
  animation: popInExplosion 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 600px;
  position: relative;
  overflow: hidden;
}

.popup-box::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2) 0%, transparent 50%);
  pointer-events: none;
}

@keyframes popInExplosion {
  0% {
    opacity: 0;
    transform: scale(0.3) rotateZ(-15deg);
  }
  50% {
    transform: scale(1.1) rotateZ(5deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotateZ(0deg);
  }
}

.popup-box h2 {
  font-size: 72px;
  margin: 0 0 30px 0;
  color: #fff;
  text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.3);
  animation: bounceExplode 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  letter-spacing: 2px;
}

@keyframes bounceExplode {
  0% {
    opacity: 0;
    transform: scale(0) rotateZ(-30deg);
  }
  50% {
    transform: scale(1.2) rotateZ(10deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotateZ(0deg);
  }
}

.popup-box p {
  font-size: 22px;
  margin: 20px 0;
  color: #fff;
  line-height: 1.8;
  font-weight: 500;
}

.popup-box p:first-of-type {
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
  animation: slideInLeft 0.6s ease-out 0.2s both;
}

@keyframes slideInLeft {
  from {
    opacity: 0;
    transform: translateX(-30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.popup-box p:last-of-type {
  font-size: 16px;
  color: rgba(255, 255, 255, 0.9);
  margin-top: 35px;
  animation: slideInRight 0.6s ease-out 0.4s both;
}

@keyframes slideInRight {
  from {
    opacity: 0;
    transform: translateX(30px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}
</style>
</head>
<body>
<div id='game'>
<div id='background'></div>
<div id='dialogue'><div id='text'></div><div id='choices'></div><div id='hint'>[Enter] 계속</div></div>
</div>
<div id='missionComplete'><div class='popup-box'><h2>📱 휴대폰 찾음!</h2><p>잃어버린 휴대폰을 성공적으로 찾았습니다!</p><p>[Enter]를 눌러 메뉴로 돌아가기</p></div></div>
<script>
let step=0,choices={},isTyping=false,waitingForNext=false,missionDone=false;

function changeBackground(imagePath) {
  const bg = document.getElementById('background');
  bg.style.backgroundImage = `url('${imagePath}')`;
}

function typeText(text,cb){
  const el=document.getElementById('text');
  el.innerText='';
  let i=0;
  isTyping=true;
  function t(){
    if(i<text.length){
      el.innerText+=text[i++];
      setTimeout(t,30);
    }else{
      isTyping=false;
      cb&&cb();
    }
  }
  t();
  el.onclick=()=>{
    if(isTyping){
      el.innerText=text;
      isTyping=false;
      cb&&cb();
    }
  }
}

function clearChoices(){
  choicesDiv.innerHTML='';
  hint.style.display='none';
}

const choicesDiv=document.getElementById('choices'),hint=document.getElementById('hint');

function addChoice(text,val){
  let b=document.createElement('button');
  b.innerText=text;
  b.onclick=()=>!isTyping&&next(val);
  choicesDiv.appendChild(b);
}

function autoNext(){
  clearChoices();
  waitingForNext=true;
  hint.style.display='block';
}

function next(choice=null){
  if(isTyping)return;
  waitingForNext=false;
  if(choice!==null)choices[step]=choice;
  step++;
  render();
}

function createConfetti() {
  const confetti = document.createElement('div');
  confetti.style.position = 'fixed';
  confetti.style.width = '10px';
  confetti.style.height = '10px';
  confetti.style.backgroundColor = ['#667eea', '#764ba2', '#f093fb', '#f5576c', '#4facfe', '#00f2fe'][Math.floor(Math.random() * 6)];
  confetti.style.left = Math.random() * 100 + '%';
  confetti.style.top = '-10px';
  confetti.style.borderRadius = '50%';
  confetti.style.pointerEvents = 'none';
  confetti.style.zIndex = '1000';
  
  const tx = (Math.random() - 0.5) * 200;
  const ty = Math.random() * 300 + 200;
  
  confetti.animate([
    { transform: 'translate(0, 0) rotate(0deg)', opacity: 1 },
    { transform: `translate(${tx}px, ${ty}px) rotate(360deg)`, opacity: 0 }
  ], {
    duration: 2000 + Math.random() * 1000,
    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
  });
  
  document.body.appendChild(confetti);
  setTimeout(() => confetti.remove(), 3000);
}

function showMissionComplete(){
  missionDone=true;
  document.getElementById('missionComplete').style.display='flex';
  
  for(let i=0; i<30; i++){
    setTimeout(() => createConfetti(), i * 30);
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(missionDone){
      localStorage.setItem('cleared_'+localStorage.getItem('current_mission'),'true');
      window.location.href='menu.html';
      return;
    }else if(!isTyping&&waitingForNext)next();
  }
});

function render(){
  clearChoices();
  if(step===1){
    changeBackground('Airport.png');
    typeText('주인공: 어? 휴대폰이 없네... 어디서 잃어버렸지?',()=>{
      addChoice('공항 직원에게 물어본다.','1');
      addChoice('(주변을 둘러본다)','2');
      addChoice('(당황한다)','3');
    });
  }
  else if(step===2){
    changeBackground('Airport.png');
    if(choices[1]==='1'){
      typeText('공항 직원: 휴대폰을 잃어버리셨어요? 분실물 센터로 가보세요!',()=>{
        addChoice('분실물 센터가 어디 있나요?','1');
        addChoice('감사합니다!','2');
      });
    }else if(choices[1]==='2'){
      typeText('(주변을 살펴본다... 휴대폰이 보이지 않는다)',()=>{
        addChoice('공항 직원에게 도움을 청한다.','1');
        addChoice('(계속 찾아본다)','2');
      });
    }else{
      typeText('주인공: 이럴 수가... 휴대폰이 정말 없다!',()=>{
        addChoice('공항 직원을 찾는다.','1');
        addChoice('(침착함을 되찾는다)','2');
      });
    }
  }
  else if(step===3){
    changeBackground('Airport.png');
    if((choices[1]==='1' && choices[2]==='1') || (choices[1]==='2' && choices[2]==='1') || (choices[1]==='3' && choices[2]==='1')){
      typeText('공항 직원: 분실물 센터는 저쪽 안내소 옆입니다. 직진하다가 오른쪽으로 꺾으세요!',()=>{
        addChoice('감사합니다! 가보겠습니다.','1');
        addChoice('혹시 휴대폰이 있을 확률이 높나요?','2');
      });
    }else if(choices[1]==='1' && choices[2]==='2'){
      typeText('공항 직원: 분실물 센터로 가보세요! 저쪽입니다.',()=>{
        addChoice('감사합니다!','1');
        addChoice('(서둘러 간다)','2');
      });
    }else if(choices[1]==='2' && choices[2]==='2'){
      typeText('(계속 찾아본다... 역시 없다. 공항 직원을 찾아간다)',()=>{
        addChoice('분실물 센터를 찾는다.','1');
        addChoice('(포기하려 한다)','2');
      });
    }else if(choices[1]==='3' && choices[2]==='2'){
      typeText('주인공: 침착해... 분실물 센터가 있을 거야.',()=>{
        addChoice('공항 직원을 찾는다.','1');
        addChoice('(표지판을 따라간다)','2');
      });
    }else{
      typeText('공항 직원: 분실물 센터는 저쪽입니다!',()=>{
        addChoice('감사합니다!','1');
        addChoice('(고개를 끄덕인다)','2');
      });
    }
  }
  else if(step===4){
    changeBackground('LostAndFound.png');
    typeText('(분실물 센터에 도착했다)\n분실물 센터 직원: 어서오세요! 뭔가 잃어버리셨어요?',()=>{
      addChoice('네, 휴대폰을 잃어버렸어요.','1');
      addChoice('휴대폰을 찾고 있는데요.','2');
      addChoice('(휴대폰 사진을 보여준다)','3');
    });
  }
  else if(step===5){
    changeBackground('LostAndFound.png');
    if(choices[4]==='1'){
      typeText('분실물 센터 직원: 휴대폰이요? 어떤 휴대폰인가요?',()=>{
        addChoice('검은색 아이폰입니다.','1');
        addChoice('최신형 삼성 휴대폰입니다.','2');
        addChoice('(휴대폰 모델을 설명한다)','3');
      });
    }else if(choices[4]==='2'){
      typeText('분실물 센터 직원: 휴대폰을 찾고 계세요? 어떤 휴대폰인가요?',()=>{
        addChoice('검은색 아이폰입니다.','1');
        addChoice('최신형 삼성 휴대폰입니다.','2');
        addChoice('(휴대폰 모델을 설명한다)','3');
      });
    }else{
      typeText('분실물 센터 직원: 아, 이 휴대폰이군요! 잠깐만요.',()=>{
        addChoice('(기다린다)','1');
        addChoice('(불안해한다)','2');
      });
    }
  }
  else if(step===6){
    changeBackground('LostAndFound.png');
    if(choices[5]===undefined || choices[5]==='1' || choices[5]==='2' || choices[5]==='3'){
      typeText('분실물 센터 직원: (컴퓨터를 확인한다) 네, 저희가 가지고 있습니다!',()=>{
        addChoice('정말요? 감사합니다!','1');
        addChoice('(안도의 한숨을 쉰다)','2');
      });
    }else{
      typeText('분실물 센터 직원: (잠깐 기다린다) 네, 저희가 가지고 있습니다!',()=>{
        addChoice('정말요? 감사합니다!','1');
        addChoice('(안도의 한숨을 쉰다)','2');
      });
    }
  }
  else if(step===7){
    changeBackground('LostAndFound.png');
    typeText('분실물 센터 직원: 신분증을 확인해야 합니다.',()=>{
      addChoice('(신분증을 건넨다)','1');
      addChoice('신분증이 어디 있지?','2');
    });
  }
  else if(step===8){
    changeBackground('LostAndFound.png');
    if(choices[7]==='1'){
      typeText('분실물 센터 직원: 감사합니다. (신분증을 확인한다) 좋습니다!',autoNext);
    }else{
      typeText('분실물 센터 직원: 신분증이 필요합니다. 찾아오실 수 있나요?',()=>{
        addChoice('(가방을 뒤진다) 여기 있습니다!','1');
        addChoice('(당황한다)','2');
      });
    }
  }
  else if(step===9){
    changeBackground('LostAndFound.png');
    if(choices[8]===undefined || choices[8]==='1'){
      typeText('분실물 센터 직원: (뒤에서 휴대폰을 꺼낸다) 여기 있습니다!',autoNext);
    }else{
      typeText('분실물 센터 직원: 괜찮습니다. 천천히 찾으세요.',()=>{
        addChoice('(신분증을 찾는다) 여기 있습니다!','1');
        addChoice('(다시 가방을 뒤진다)','2');
      });
    }
  }
  else if(step===10){
    changeBackground('LostAndFound.png');
    typeText('주인공: 오! 정말 내 휴대폰이다!',autoNext);
  }
  else if(step===11){
    changeBackground('LostAndFound.png');
    typeText('분실물 센터 직원: 다행이네요! 앞으로 조심하세요!',autoNext);
  }
  else if(step===12){
    changeBackground('LostAndFound.png');
    typeText('주인공: 정말 감사합니다! 도움이 많이 됐어요!',showMissionComplete);
  }
}

next();
</script>
</body>
</html>
